<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patients | DR Screening</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/dashboard.css') }}"
    >
</head>

<body>

<header class="topbar">

    <div class="brand">
        DR Screening
    </div>

    <div class="user-section">

        <span id="userName">
            Health Worker
        </span>

        <button
            onclick="logout()"
            class="logout-btn"
        >
            Logout
        </button>

    </div>

</header>


<main class="dashboard-container">

    <section class="welcome-section">

        <h1>Patients</h1>

        <p>
            Search and manage patient records.
        </p>

    </section>


    <section class="patient-actions">

        <input
            type="text"
            id="searchInput"
            placeholder="Search by name, Patient ID or mobile number"
        >

        <button
            id="addPatientButton"
            class="primary-button"
        >
            + Add Patient
        </button>

    </section>


    <section class="dashboard-section">

        <div
            id="patientsList"
            class="patients-list"
        >
            <div class="empty-state">
                <h3>Loading patients...</h3>
            </div>
        </div>

    </section>

</main>


<script src="{{ url_for('static', filename='js/patients.js') }}"></script>

</body>

</html>
