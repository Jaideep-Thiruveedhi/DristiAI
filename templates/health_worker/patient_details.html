<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Patient Details | DR Screening
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/dashboard.css') }}"
    >

</head>


<body>


<header class="topbar">

    <div class="brand">
        DR Screening
    </div>


    <div class="user-section">

        <span id="userName">
            Health Worker
        </span>

        <button
            onclick="logout()"
            class="logout-btn"
        >
            Logout
        </button>

    </div>

</header>



<main class="dashboard-container">


    <!-- ======================================================
         PAGE HEADER
         ====================================================== -->

    <section class="welcome-section">

        <h1>
            Patient Details
        </h1>

        <p>
            View patient information and screening history.
        </p>

    </section>



    <!-- ======================================================
         PATIENT INFORMATION
         ====================================================== -->

    <section class="dashboard-section">

        <div class="section-header">

            <div>

                <h2>
                    Patient Information
                </h2>

                <p>
                    Basic information of the patient.
                </p>

            </div>

        </div>


        <div id="patientDetails">

            <div class="empty-state">

                <h3>
                    Loading patient details...
                </h3>

            </div>

        </div>

    </section>



    <!-- ======================================================
         SCREENING HISTORY
         ====================================================== -->

    <section
        class="dashboard-section"
        id="screeningHistorySection"
    >

        <div class="section-header">

            <div>

                <h2>
                    Screening History
                </h2>

                <p>
                    Select a screening to view the full report.
                </p>

            </div>


            <button
                type="button"
                class="primary-button"
                id="newScreeningButton"
            >
                + New Screening
            </button>

        </div>


        <div id="screeningHistory">

            <div class="empty-state">

                <h3>
                    Loading screening history...
                </h3>

                <p>
                    Please wait.
                </p>

            </div>

        </div>

    </section>



    <!-- ======================================================
         BACK BUTTON
         ====================================================== -->

    <section class="form-actions">

        <button
            type="button"
            class="secondary-button"
            id="backButton"
        >
            ← Back to Patients
        </button>

    </section>


</main>



<script>

    const patientId =
        "{{ patient_id }}";

</script>


<script
    src="{{ url_for('static', filename='js/patient_details.js') }}"
></script>


</body>

</html>
