<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Patient | DR Screening</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/dashboard.css') }}"
    >
</head>

<body>

<header class="topbar">

    <div class="brand">
        DR Screening
    </div>

    <div class="user-section">

        <span id="userName">
            Health Worker
        </span>

        <button
            onclick="logout()"
            class="logout-btn"
        >
            Logout
        </button>

    </div>

</header>


<main class="dashboard-container">

    <section class="welcome-section">

        <h1>Add New Patient</h1>

        <p>
            Enter the patient's basic information.
        </p>

    </section>


    <section class="form-section">

        <form id="patientForm" autocomplete="off">

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter patient's name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="age">
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    min="0"
                    max="120"
                    placeholder="Enter patient's age"
                    required
                >

            </div>


            <div class="form-group">

                <label for="gender">
                    Gender
                </label>

                <select id="gender" required>

                    <option value="">
                        Select gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="mobile">
                    Mobile Number
                    <span class="optional">
                        (Optional)
                    </span>
                </label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter mobile number"
                    maxlength="15"
                >

            </div>


            <div
                id="patientError"
                class="error-message"
            ></div>


            <div class="form-actions">

                <button
                    type="button"
                    class="secondary-button"
                    onclick="window.location.href='/health-worker/patients'"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="primary-button"
                    id="savePatientButton"
                >
                    Save Patient
                </button>

            </div>

        </form>

    </section>

</main>


<script src="{{ url_for('static', filename='js/new_patient.js') }}"></script>

</body>

</html>
