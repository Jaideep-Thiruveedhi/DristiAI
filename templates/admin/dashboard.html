<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | DR Screening</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/dashboard.css') }}"
    >
</head>

<body>

<header class="topbar">

    <div class="brand">
        DR Screening
    </div>

    <div class="user-section">
        <span id="userName">Admin</span>

        <button onclick="logout()" class="logout-btn">
            Logout
        </button>
    </div>

</header>


<main class="dashboard-container">

    <section class="welcome-section">

        <h1>Admin Dashboard</h1>

        <p>
            Manage users, models and system information.
        </p>

    </section>


    <section class="dashboard-grid">

        <div class="dashboard-card">

            <h2>Users</h2>

            <p>
                Manage doctors and health workers.
            </p>

            <button>
                Manage Users
            </button>

        </div>


        <div class="dashboard-card">

            <h2>Model Versions</h2>

            <p>
                Manage approved AI model versions.
            </p>

            <button>
                View Models
            </button>

        </div>


        <div class="dashboard-card">

            <h2>System Statistics</h2>

            <p>
                View screening and system statistics.
            </p>

            <button>
                View Statistics
            </button>

        </div>

    </section>

</main>


<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

</body>
</html>
