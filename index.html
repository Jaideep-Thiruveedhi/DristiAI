<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=http://127.0.0.1:5000">
    <title>DristiAI Launcher</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            color: #111827;
            background: #f3f4f6;
        }

        main {
            width: min(520px, calc(100vw - 32px));
            padding: 24px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #ffffff;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 24px;
        }

        p {
            margin: 0 0 14px;
            line-height: 1.5;
            color: #4b5563;
        }

        code {
            display: block;
            padding: 12px;
            border-radius: 6px;
            background: #f9fafb;
            color: #111827;
            overflow-x: auto;
        }

        a {
            color: #2563eb;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main>
        <h1>DristiAI</h1>
        <p>
            Redirecting to the Flask app. Open the app through localhost, not by
            opening files from frontend/templates directly.
        </p>
        <p>
            If it does not open, start the backend first:
        </p>
        <code>cd backend &amp;&amp; python app.py</code>
        <p>
            Then open <a href="http://127.0.0.1:5000">http://127.0.0.1:5000</a>.
        </p>
    </main>
</body>
</html>
